<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="麦麦校园搭子 McCampusCombo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f1310"/>
      <stop offset="1" stop-color="#c0231d"/>
    </linearGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf4d"/>
      <stop offset="1" stop-color="#f0a91c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- 装饰圆点 -->
  <circle cx="1120" cy="52" r="90" fill="#ffffff" opacity="0.05"/>
  <circle cx="80" cy="260" r="70" fill="#ffffff" opacity="0.05"/>
  <circle cx="1040" cy="240" r="40" fill="#ffc72c" opacity="0.12"/>

  <!-- 左侧：几何汉堡（通用图形，非官方商标） -->
  <g transform="translate(96,88)">
    <!-- 顶层面包 -->
    <path d="M0 42 Q0 0 52 0 Q104 0 104 42 L104 46 L0 46 Z" fill="url(#bun)"/>
    <circle cx="30" cy="16" r="3.4" fill="#fff3d6"/>
    <circle cx="56" cy="10" r="3.4" fill="#fff3d6"/>
    <circle cx="80" cy="18" r="3.4" fill="#fff3d6"/>
    <!-- 生菜 -->
    <rect x="-4" y="46" width="112" height="10" rx="5" fill="#7ec850"/>
    <!-- 肉饼 -->
    <rect x="2" y="58" width="100" height="16" rx="8" fill="#8a4b24"/>
    <!-- 底层面包 -->
    <rect x="0" y="76" width="104" height="22" rx="10" fill="url(#bun)"/>
  </g>

  <!-- 左侧薯条 -->
  <g transform="translate(216,120)">
    <path d="M0 14 L14 0 L58 0 L72 14 L66 96 L6 96 Z" fill="#c8201a" stroke="#8f1310" stroke-width="2"/>
    <rect x="14" y="-14" width="10" height="52" rx="4" fill="#ffcf4d" transform="rotate(-8 19 12)"/>
    <rect x="30" y="-20" width="10" height="58" rx="4" fill="#ffd964"/>
    <rect x="46" y="-14" width="10" height="52" rx="4" fill="#ffcf4d" transform="rotate(8 51 12)"/>
  </g>

  <!-- 主标题 -->
  <text x="340" y="122" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="64" font-weight="800" fill="#ffc72c">麦麦校园搭子</text>
  <text x="342" y="168" font-family="Consolas,monospace" font-size="26" font-weight="600" fill="#ffffff" opacity="0.85">mcd-campus-combo</text>

  <!-- 副标题 -->
  <text x="342" y="216" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#ffffff" opacity="0.92">基于麦当劳官方 MCP 的校园场景化凑单助手</text>
  <text x="342" y="252" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#ffffff" opacity="0.66">早八快手 · 课间垫肚 · 考试周补能量 · 宿舍夜宵 · 社团聚餐</text>

  <!-- 右下角徽标点 -->
  <text x="1150" y="272" text-anchor="end" font-family="Consolas,monospace" font-size="15" fill="#ffffff" opacity="0.4">MCP · mcp.mcd.cn</text>
</svg>
