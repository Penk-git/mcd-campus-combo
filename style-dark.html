<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>麦当劳校园省钱凑单助手 · 暗色霓虹风</title>
<style>
  :root {
    --bg: #0b0f17;
    --card: rgba(22,28,40,.72);
    --ink: #e8eef7;
    --muted: #8ea0bd;
    --cyan: #2de2e6;
    --mag: #ff4dd6;
    --yellow: #ffd23f;
    --red: #ff5a5f;
    --line: rgba(45,226,230,.28);
    --shadow: 0 0 24px rgba(45,226,230,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", monospace, sans-serif;
    background:
      radial-gradient(circle at 15% -5%, rgba(255,77,214,.16), transparent 38%),
      radial-gradient(circle at 90% 10%, rgba(45,226,230,.16), transparent 40%),
      var(--bg);
    color: var(--ink); line-height: 1.5; padding: 16px 14px 48px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; padding: 12px 4px 16px; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    color: var(--bg); background: linear-gradient(90deg, var(--cyan), var(--mag));
    padding: 4px 13px; border-radius: 4px; box-shadow: 0 0 14px rgba(45,226,230,.5);
  }
  h1 { font-size: 24px; margin: 14px 0 4px; letter-spacing: 1px; font-weight: 800; color: #fff; text-shadow: 0 0 18px rgba(45,226,230,.45); }
  .sub { font-size: 13px; color: var(--muted); margin: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; backdrop-filter: blur(8px);
  }
  .label { font-size: 13px; font-weight: 700; color: var(--cyan); margin: 0 0 10px; letter-spacing: .5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: rgba(45,226,230,.06); color: var(--ink);
    padding: 8px 13px; border-radius: 999px; font-size: 14px; cursor: pointer; transition: .15s; user-select: none;
  }
  .chip:active { transform: scale(.96); }
  .chip.on { background: var(--cyan); border-color: var(--cyan); color: #04121a; font-weight: 800; box-shadow: 0 0 14px rgba(45,226,230,.55); }
  .row { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .field { flex: 1 1 140px; }
  .field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; letter-spacing: .5px; }
  .field input, .field select {
    width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--line);
    border-radius: 10px; background: rgba(11,15,23,.6); color: var(--ink); outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(45,226,230,.35); }
  .note { font-size: 12px; color: var(--muted); margin: 12px 0 0; min-height: 16px; }
  .go {
    width: 100%; margin-top: 14px; border: 1px solid var(--cyan); cursor: pointer;
    background: linear-gradient(90deg, rgba(45,226,230,.16), rgba(255,77,214,.16));
    color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 2px;
    padding: 13px; border-radius: 12px; box-shadow: 0 0 18px rgba(45,226,230,.3); transition: .15s;
  }
  .go:active { transform: translateY(1px); }
  .results { margin-top: 4px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
  .rcard {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 14px 12px; margin-bottom: 12px; box-shadow: var(--shadow); position: relative; overflow: hidden; backdrop-filter: blur(8px);
  }
  .rcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  .rcard.r1::before { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
  .rcard.r2::before { background: var(--mag); box-shadow: 0 0 12px var(--mag); }
  .rcard.r3::before { background: #6b7cff; box-shadow: 0 0 12px #6b7cff; }
  .rtop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .rank { font-size: 12px; font-weight: 800; color: #04121a; background: var(--cyan); padding: 2px 9px; border-radius: 999px; }
  .r1 .rank { background: var(--yellow); }
  .r2 .rank { background: var(--mag); }
  .r3 .rank { background: #6b7cff; color: #fff; }
  .pay { font-size: 13px; color: var(--muted); }
  .pay b { font-size: 26px; color: var(--red); font-weight: 900; margin-right: 2px; text-shadow: 0 0 12px rgba(255,90,95,.5); }
  .pay .orig { text-decoration: line-through; opacity: .55; }
  .items { margin: 10px 0 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .itag { background: rgba(45,226,230,.08); border: 1px solid var(--line); color: var(--ink); font-size: 13px; padding: 4px 9px; border-radius: 8px; }
  .itag b { color: var(--cyan); }
  .meta { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .meta span b { color: var(--ink); font-weight: 700; }
  .cpn { display: inline-block; font-size: 11px; color: var(--yellow); background: rgba(255,210,63,.1); border: 1px solid rgba(255,210,63,.4); padding: 1px 7px; border-radius: 6px; margin-left: 6px; }
  .meta span .mref { font-weight: 700; opacity: .6; font-size: 10px; margin-left: 3px; }
  .nutri { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; padding: 7px 9px; background: rgba(127,127,127,.12); border: 1.5px dashed rgba(255,255,255,.22); border-radius: 10px; }
  .ntags { display: inline-flex; gap: 5px; }
  .ntag { font-size: 10px; font-weight: 900; color: #fff; background: #2f9e6f; padding: 2px 7px; border-radius: 4px; }
  .narr { font-size: 11.5px; font-weight: 700; color: var(--ink); line-height: 1.45; }
  .star {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px auto 4px; max-width: 420px;
    background: linear-gradient(90deg, var(--cyan), var(--mag)); color: #04121a; font-weight: 800; font-size: 15px;
    text-decoration: none; padding: 12px; border-radius: 12px; box-shadow: 0 0 20px rgba(255,77,214,.4);
  }
  .star:active { transform: translateY(1px); }
  .copy {
    display: block; width: 100%; max-width: 420px; margin: 10px auto 0;
    border: 1px solid var(--line); background: transparent; color: var(--cyan); font-weight: 700; font-size: 13px;
    padding: 9px; border-radius: 10px; cursor: pointer;
  }
  .disc { font-size: 11px; color: #5d6b82; text-align: center; margin-top: 22px; line-height: 1.7; }
  a.link { color: var(--cyan); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">◆ 2026 DEV CHALLENGE</span>
    <h1>麦当劳校园省钱凑单助手</h1>
    <p class="sub">按预算 / 校园场景，用麦当劳中国 MCP 凑出最划算套餐</p>
  </header>

  <div class="panel">
    <p class="label">① 选校园场景</p>
    <div class="chips" id="chips"></div>
    <div class="row">
      <div class="field">
        <label>预算（元）</label>
        <input id="budget" type="number" min="1" step="1" value="15" inputmode="numeric" />
      </div>
      <div class="field">
        <label>想要什么</label>
        <select id="mode">
          <option value="count">份数最多</option>
          <option value="energy">每元热量最高</option>
          <option value="protein">每元蛋白最高</option>
        </select>
      </div>
    </div>
    <p class="note" id="note"></p>
    <button class="go" id="go">▶ 算一下最划算的搭法</button>
  </div>

  <div class="results" id="results">
    <div class="empty">选好场景点「算一下」，3 秒出 Top3 凑单方案</div>
  </div>

  <a class="star" href="https://github.com/Penk-git/mcd-campus-combo" target="_blank" rel="noopener">★ 觉得好用？给项目点个 Star 支持一下</a>
  <button class="copy" id="copy">📋 复制当前方案</button>

  <p class="disc">
    当前为演示数据（内置菜单与示意优惠），真实版本接入麦当劳中国 MCP<br/>
    实时拉取 query-meals / available-coupons / calculate-price 等工具，显示真实价格与优惠。<br/>
    项目地址：<a class="link" href="https://github.com/Penk-git/mcd-campus-combo" target="_blank" rel="noopener">github.com/Penk-git/mcd-campus-combo</a>
  </p>
</div>

<script src="combo.js"></script>
<script src="demo.js"></script>
</body>
</html>
