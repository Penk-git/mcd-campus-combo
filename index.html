<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>麦当劳校园省钱凑单助手 · 红黄风</title>
<style>
  :root {
    --red: #da291c;
    --red-d: #b51f14;
    --yellow: #ffc72c;
    --ink: #27251f;
    --muted: #8a6f3a;
    --card: #fffdf5;
    --line: #f0d9a0;
    --shadow: 0 8px 22px rgba(218,41,28,.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 12% 0%, rgba(255,199,44,.25), transparent 40%),
      radial-gradient(circle at 88% 6%, rgba(218,41,28,.18), transparent 42%),
      #fff6e6;
    color: var(--ink); line-height: 1.5; padding: 16px 14px 48px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; padding: 12px 4px 16px; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 800; color: #fff;
    background: var(--red); padding: 4px 13px; border-radius: 6px;
    box-shadow: 0 3px 0 var(--red-d);
  }
  h1 {
    font-size: 25px; margin: 14px 0 4px; letter-spacing: .5px; font-weight: 900;
    color: var(--red); text-shadow: 2px 2px 0 var(--yellow);
  }
  .sub { font-size: 13px; color: var(--muted); margin: 0; font-weight: 600; }
  .panel {
    background: var(--card); border: 2px solid var(--yellow); border-radius: 18px;
    padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .label { font-size: 13px; font-weight: 800; color: var(--red); margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 2px solid var(--line); background: #fff; color: var(--ink);
    padding: 8px 13px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: .15s; user-select: none;
  }
  .chip:active { transform: scale(.96); }
  .chip.on { background: var(--yellow); border-color: var(--red); color: var(--ink); box-shadow: 0 2px 0 var(--red); }
  .row { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .field { flex: 1 1 140px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 700; display: block; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 10px 12px; font-size: 15px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 12px; background: #fffdf5; color: var(--ink); outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--red); }
  .note { font-size: 12px; color: var(--muted); font-weight: 600; margin: 12px 0 0; min-height: 16px; }
  .go {
    width: 100%; margin-top: 14px; border: none; cursor: pointer;
    background: var(--red); color: #fff; font-size: 17px; font-weight: 900; letter-spacing: 1px;
    padding: 14px; border-radius: 14px; box-shadow: 0 5px 0 var(--red-d); transition: .12s;
  }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--red-d); }
  .results { margin-top: 4px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; font-weight: 700; }
  .rcard {
    background: var(--card); border: 2px solid var(--line); border-radius: 18px;
    padding: 14px 14px 12px; margin-bottom: 12px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .rcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--yellow); }
  .rcard.r1::before { background: var(--red); }
  .rcard.r2::before { background: #f0a500; }
  .rcard.r3::before { background: #c9a36b; }
  .rtop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .rank { font-size: 12px; font-weight: 900; color: #fff; background: var(--red); padding: 3px 10px; border-radius: 6px; }
  .r1 .rank { background: var(--red); }
  .r2 .rank { background: #f0a500; }
  .r3 .rank { background: #c9a36b; }
  .pay { font-size: 13px; color: var(--muted); font-weight: 700; }
  .pay b { font-size: 27px; color: var(--red); font-weight: 900; margin-right: 2px; }
  .pay .orig { text-decoration: line-through; opacity: .65; }
  .items { margin: 10px 0 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .itag { background: #fff3d6; border: 1.5px solid var(--yellow); color: var(--ink); font-size: 13px; font-weight: 700; padding: 4px 9px; border-radius: 10px; }
  .itag b { color: var(--red); }
  .meta { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 700; flex-wrap: wrap; }
  .meta span b { color: var(--ink); font-weight: 900; }
  .cpn {
    display: inline-block; font-size: 11px; font-weight: 800; color: #fff; background: var(--red);
    padding: 2px 8px; border-radius: 4px; margin-left: 6px;
  }
  .star {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px auto 4px; max-width: 420px;
    background: var(--yellow); color: var(--red); font-weight: 900; font-size: 15px;
    text-decoration: none; padding: 13px; border-radius: 14px; box-shadow: 0 5px 0 var(--red);
  }
  .star:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--red); }
  .copy {
    display: block; width: 100%; max-width: 420px; margin: 10px auto 0;
    border: 2px solid var(--red); background: #fff; color: var(--red); font-weight: 800; font-size: 13px;
    padding: 10px; border-radius: 12px; cursor: pointer;
  }
  .disc { font-size: 11px; color: #b08a3a; text-align: center; margin-top: 22px; line-height: 1.7; font-weight: 600; }
  a.link { color: var(--red); text-decoration: none; font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">🏆 2026 程序员创意开发大赛</span>
    <h1>🍔 麦当劳校园省钱凑单</h1>
    <p class="sub">按预算 / 校园场景，凑出最划算套餐 · 一句话就能用</p>
  </header>

  <div class="panel">
    <p class="label">① 选校园场景</p>
    <div class="chips" id="chips"></div>
    <div class="row">
      <div class="field">
        <label>预算（元）</label>
        <input id="budget" type="number" min="1" step="1" value="15" inputmode="numeric" />
      </div>
      <div class="field">
        <label>想要什么</label>
        <select id="mode">
          <option value="count">份数最多</option>
          <option value="energy">每元热量最高</option>
          <option value="protein">每元蛋白最高</option>
        </select>
      </div>
    </div>
    <p class="note" id="note"></p>
    <button class="go" id="go">算一下最划算的搭法 🍟</button>
  </div>

  <div class="results" id="results">
    <div class="empty">选好场景点「算一下」，3 秒出 Top3 凑单方案 👆</div>
  </div>

  <a class="star" href="https://github.com/Penk-git/mcd-campus-combo" target="_blank" rel="noopener">⭐ 觉得好用？给项目点个 Star 支持一下</a>
  <button class="copy" id="copy">📋 复制当前方案</button>

  <p class="disc">
    当前为演示数据（内置菜单与示意优惠），真实版本接入麦当劳中国 MCP<br/>
    实时拉取 <b>query-meals / available-coupons / calculate-price</b> 等工具，显示真实价格与优惠。<br/>
    项目地址：<a class="link" href="https://github.com/Penk-git/mcd-campus-combo" target="_blank" rel="noopener">github.com/Penk-git/mcd-campus-combo</a>
  </p>
</div>

<script src="combo.js"></script>
<script src="demo.js"></script>
</body>
</html>
